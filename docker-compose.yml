services:
  shortly-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5254:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://mongo:27017
      - MongoDB__DatabaseName=shortly
      - ServiceBus__ConnectionString=
      - ServiceBus__TopicName=shortly-events
      - ApiKeys__Clients__0__Name=docker-client
      - ApiKeys__Clients__0__Key=dev-api-key-shortly-2026
      - Redis__ConnectionString=redis:6379
      - Redis__CacheTtlSeconds=300
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo-data:
  redis-data:
